name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Publishes via PyPI Trusted Publishing (OIDC) — no token stored in the
    # repo. One-time setup on pypi.org: add a "pending publisher" for the
    # project name `search-mcp` with owner `sweetcornna`, repository
    # `free-search-mcp`, workflow `release.yml`, environment `pypi`.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
