name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Reuses ci.yml verbatim so the release gate and the PR gate are the same
  # definition — they can never silently diverge.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Publishes `free-search-mcp` with the PYPI_API_TOKEN repo secret
    # (Settings → Secrets and variables → Actions). Every `v*` tag push
    # publishes automatically; the only maintenance ever needed is rotating
    # the token on pypi.org and updating that one secret.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
